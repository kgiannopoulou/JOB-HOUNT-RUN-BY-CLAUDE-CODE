name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        run: npx supabase start -x vector,logflare,imgproxy,edge-runtime,realtime,studio,postgres-meta

      - name: Create test environment
        run: |
          npx supabase status -o env > supabase.env
          . ./supabase.env
          {
            echo "SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "CRON_SECRET=ci-only-secret"
          } > .env.local

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Database tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Check the secret key is not in browser code
        run: |
          . ./supabase.env
          if grep -rq "$SECRET_KEY" .next/static; then
            echo "Secret key found in the browser bundle"
            exit 1
          fi

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
